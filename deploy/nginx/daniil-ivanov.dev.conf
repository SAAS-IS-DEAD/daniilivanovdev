server {
    listen 80;
    listen [::]:80;
    server_name daniil-ivanov.dev www.daniil-ivanov.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://daniil-ivanov.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.daniil-ivanov.dev;
    ssl_certificate /etc/letsencrypt/live/daniil-ivanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daniil-ivanov.dev/privkey.pem;
    return 301 https://daniil-ivanov.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name daniil-ivanov.dev;
    ssl_certificate /etc/letsencrypt/live/daniil-ivanov.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daniil-ivanov.dev/privkey.pem;
    location / {
        proxy_pass http://APP_CLUSTER_IP:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
