apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: daniilivanovdev
  namespace: argocd
spec:
  sourceRepos:
    - ssh://git@github.com/SAAS-IS-DEAD/daniilivanovdev.git
  destinations:
    - namespace: daniilivanovdev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daniilivanovdev
  namespace: argocd
spec:
  project: daniilivanovdev
  source:
    repoURL: ssh://git@github.com/SAAS-IS-DEAD/daniilivanovdev.git
    targetRevision: deploy/k3s-02
    path: deploy/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: daniilivanovdev
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
