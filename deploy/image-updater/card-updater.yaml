apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: daniilivanovdev
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/card-image-updater-git
    gitConfig:
      repository: ssh://git@github.com/SAAS-IS-DEAD/daniilivanovdev.git
      branch: deploy/k3s-02
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: daniilivanovdev
      images:
        - alias: release
          imageName: ghcr.io/saas-is-dead/daniilivanovdev:main
          commonUpdateSettings:
            updateStrategy: digest
            forceUpdate: true
            pullSecret: pullsecret:argocd/card-ghcr-read
          manifestTargets:
            kustomize:
              name: ghcr.io/saas-is-dead/daniilivanovdev
