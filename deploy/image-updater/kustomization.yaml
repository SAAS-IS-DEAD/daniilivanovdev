apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - vendor/install.yaml
patches:
  - target:
      kind: Deployment
      name: argocd-image-updater-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
