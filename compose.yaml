services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-card}
    volumes:
      - card-data:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 2s
      timeout: 5s
      retries: 30
  setup:
    build:
      context: .
      target: setup
    image: business-card-setup:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-card}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-card}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build:
      context: .
      target: runtime
    image: business-card:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-card}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-card}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      AUTH_RATE_KEY: ${AUTH_RATE_KEY:?Set AUTH_RATE_KEY in .env}
      CLIENT_IP_MODE: ${CLIENT_IP_MODE:-direct}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
volumes:
  card-data:
