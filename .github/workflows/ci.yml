name: CI and deployment
on:
  push:
    branches: [ main, 001-digital-business-card ]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run lint
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run format:check
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build
  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run typecheck
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run test:unit
  integration:
    name: Backend integration / Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run db:generate && npm run test:integration
  contract:
    name: GraphQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run db:generate && npm run test:contract
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run test:coverage
  deployment-tests:
    name: Deployment configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run test:deployment
  e2e:
    name: Browser E2E / production Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create isolated CI configuration
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          writeFileSync('.env', `POSTGRES_PASSWORD=${randomBytes(24).toString('hex')}\nAUTH_RATE_KEY=${randomBytes(32).toString('hex')}\nAPP_ORIGIN=http://localhost:3000\n`, { mode: 0o600 });
          JS
      - name: Build and start application
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Run browser tests
        run: npm run test:e2e
      - name: Application diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 100 app setup
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [ lint, format, types, build, unit, integration, contract, coverage, deployment-tests, e2e ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST APP_ORIGIN DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment configuration: $name"
              exit 1
            fi
          done
      - name: Build immutable Linux images
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --target runtime -t "card-runtime:$REVISION" .
          docker build --platform linux/amd64 --target setup -t "card-setup:$REVISION" .
          docker pull --platform linux/amd64 postgres:17.6-bookworm
          docker save "card-runtime:$REVISION" "card-setup:$REVISION" postgres:17.6-bookworm | gzip -1 > /tmp/card-release.tar.gz
      - name: Deploy through the restricted server command
        env:
          REVISION: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/card-deploy"
          chmod 600 "$HOME/.ssh/card-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          { printf '%s\n' "$REVISION"; cat /tmp/card-release.tar.gz; } |
            ssh -i "$HOME/.ssh/card-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "card-deployer@$DEPLOY_HOST"
      - name: Check public release
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          curl --fail --retry 6 --retry-delay 5 "$APP_ORIGIN/health/ready"
          curl --fail "$APP_ORIGIN/graphql" -H 'Content-Type: application/json' \
            --data '{"query":"{profile{name skills{name}}}"}' | tee /tmp/profile-result.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/profile-result.json")); if(r.errors || !r.data?.profile?.name) process.exit(1)'
