name: CI and deployment
on:
  push:
    branches: [ main, 001-digital-business-card ]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run lint
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run format:check
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build
  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run typecheck
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run test:unit
  integration:
    name: Backend integration / Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run db:generate && npm run test:integration
  contract:
    name: GraphQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run db:generate && npm run test:contract
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run build && npm run test:coverage
  ci-tests:
    name: CI configuration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run test:ci
  e2e:
    name: Browser E2E / production Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create isolated CI configuration
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          writeFileSync('.env', `POSTGRES_PASSWORD=${randomBytes(24).toString('hex')}\nAPP_ORIGIN=http://localhost:3000\n`, { mode: 0o600 });
          JS
      - name: Build and start application
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Run browser tests
        run: npm run test:e2e
      - name: Application diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 100 app setup
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes
  secrets:
    name: Secret scan / full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan without exposing matched secrets
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_DOWNLOAD_DIR="$(mktemp -d)"
          GITLEAKS_RELEASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${GITLEAKS_RELEASE_URL}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${GITLEAKS_DOWNLOAD_DIR}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "${GITLEAKS_RELEASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "${GITLEAKS_DOWNLOAD_DIR}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$GITLEAKS_DOWNLOAD_DIR" && sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt")
          tar -xzf "${GITLEAKS_DOWNLOAD_DIR}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$GITLEAKS_DOWNLOAD_DIR" gitleaks
          "$GITLEAKS_DOWNLOAD_DIR/gitleaks" git --no-banner --redact=100 --ignore-gitleaks-allow --log-opts="--all --full-history" "$GITHUB_WORKSPACE"
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [ lint, format, types, build, unit, integration, contract, coverage, ci-tests, e2e, secrets ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish release
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/saas-is-dead/daniilivanovdev
          docker build --platform linux/amd64 --target release -t "$IMAGE:$REVISION" -t "$IMAGE:main" .
          docker push "$IMAGE:$REVISION"
          docker push "$IMAGE:main"
